    <!-- Resolve Canonical & Absolute Social Card URLs Dynamically Across Hosts -->
    <script>
      (function () {
        var currentOrigin = window.location.origin;
        var cleanPath = window.location.pathname || '/';
        var currentUrl = currentOrigin + cleanPath;

        var canonicalEl = document.getElementById('canonical-link');
        if (canonicalEl) canonicalEl.setAttribute('href', currentUrl);

        var ogUrlEl = document.getElementById('og-url-meta');
        if (ogUrlEl) ogUrlEl.setAttribute('content', currentUrl);

        var ogImageEl = document.getElementById('og-image-meta');
        var twitterImageEl = document.getElementById('twitter-image-meta');
        var portraitUrl = new URL('assets/extracted/portrait.png', currentUrl).toString();
        if (ogImageEl) ogImageEl.setAttribute('content', portraitUrl);
        if (twitterImageEl) twitterImageEl.setAttribute('content', portraitUrl);
      })();
    </script>
